[project]
name = "his"
version = "0.1.0"
description = "Hybrid Inference Scheme (HIS) experiments"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "torch>=2.5,<2.8",
    "torchvision>=0.20,<0.23",
    "sentence-transformers>=3.1.1",
    "diffusers>=0.32,<0.40",
    "transformers>=4.45,<5",
    "accelerate>=0.34",
    "protobuf==5.28.2",
    "sentencepiece==0.2.0",
    "openai-clip==1.0.1",  # 1.0.1 imports `pkg_resources`; Dockerfile patches it to `import packaging`
    "openpyxl>=3.1.5",
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "opencv-python-headless>=4.8",
    "piq>=0.8.0",
    "image-reward>=1.5",
    "pyiqa>=0.1.10",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []
