[project]
name = "his"
version = "0.1.0"
description = "Hybrid Inference Scheme (HIS) experiments"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "torch==2.4.1",
    "torchvision==0.19.1",
    "sentence-transformers==3.1.1",
    "diffusers==0.30.3",
    "transformers==4.44.2",
    "accelerate==0.34.2",
    "protobuf==5.28.2",
    "sentencepiece==0.2.0",
    "openai-clip==1.0.1",
    "openpyxl==3.1.5",
    "fvcore>=0.1.5",
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "opencv-python-headless>=4.8",
    "piq>=0.8.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []
